# sqlcli configuration example
#
# Copy to ~/.config/sqlcli/config.toml (Windows: %APPDATA%\sqlcli\config.toml)
# or pass it with:  sqlcli -config ./config.example.toml
# Every setting is optional; the values below are the defaults unless noted.
# Yes/no settings accept true / false or "yes" / "no".

[oracle]
  # Oracle Instant Client directory (Windows: the one with oci.dll).
  # Empty or missing = use $ORACLE_HOME.
  lib_dir = "/usr/local/oracle"

[editor]
  tab_width = 4             # spaces inserted by Tab; also used for pasted tabs
  auto_indent = true        # Enter keeps the indentation of the current line
  syntax_highlight = true   # colour SQL keywords, strings, comments, numbers
  completion = true         # code completion while typing (Ctrl-Space opens it)

[query]
  max_rows = 1000           # rows per fetch; more come when you scroll or press End
  fetch_all = false         # true = fetch all rows of every query at once
  timeout_seconds = 0       # cancel statements after N seconds; 0 = never
  auto_commit = false       # true = commit every statement immediately
  dbms_output = true        # show DBMS_OUTPUT in the results pane
  substitution = true       # SQL*Plus &variables (SET DEFINE ON at start)

[ui]
  mouse = true              # clicks, wheel and drag-to-copy; hold Shift for the terminal's selection
  show_connections = true   # connections panel and object tree visible at start (F2)
  record_page = 10          # records PgUp / PgDn move in the record view
  save_session_on_exit = true   # save the loaded session when quitting
  selection_color = "24"    # selected result row: 256-colour number or "#rrggbb"

[history]
  path = ""                 # SQLite file; empty = ~/.local/state/sqlcli/history.db
                            # (Windows: %LOCALAPPDATA%\sqlcli\history.db)
  max_entries = 500         # entries listed in the history browser (F6)

# Keyboard shortcuts of the global commands, here with their default keys.
# Each action takes one key or a list of keys; change or delete lines as you
# like (a deleted action keeps its defaults). Keys are named as sqlcli names
# them: f1 ... f12, ctrl+s, alt+x, shift+tab, ctrl+shift+up, ctrl+pgdown
# (case and "-" instead of "+" don't matter). SQLCLI_DEBUG_KEYS=1 shows the
# name of each key you press. A key may belong to one action only.
# Keys inside a panel, the editor's JOE keys and ^K commands are fixed.
[keys]
  help = "f1"                               # help screen
  connections = "f2"                        # show / hide the connections panel
  results = "f3"                            # show / hide the results panel
  sql = "f4"                                # show / hide the SQL panel
  run = ["f5", "ctrl+enter", "alt+enter"]   # run the statement at the cursor (or the block)
  history = "f6"                            # SQL history
  run_all = "f7"                            # run the whole SQL panel
  rollback = "f8"                           # rollback
  commit = "f9"                             # commit
  sessions = "f10"                          # session window
  save_session = "ctrl+s"                   # save the session
  object_tree = "f12"                       # jump to the object tree
  next_tab = "ctrl+pgdown"                  # next SQL tab
  prev_tab = "ctrl+pgup"                    # previous SQL tab
  panel_left = "ctrl+left"                  # panel to the left
  panel_right = "ctrl+right"                # panel to the right
  panel_up = "ctrl+up"                      # panel above
  panel_down = "ctrl+down"                  # panel below
  prev_panel = "shift+tab"                  # previous panel
  cancel = "ctrl+c"                         # cancel the running statement

# Connections: add and edit them in sqlcli too (a / e in the connections panel).
# connect_string: TNS alias (from $TNS_ADMIN/tnsnames.ora), Easy Connect
# host:port/service, or a full (DESCRIPTION=...) descriptor.

[[connections]]
  name = "dev"                       # label; also used with  sqlcli -c dev
  user = "scott"
  password_env = "DEV_PASSWORD"      # read the password from this environment variable
  connect_string = "dbhost:1521/ORCLPDB1"

[[connections]]
  name = "prod-report"
  user = "report"
  password_env = "PROD_PASSWORD"
  connect_string = "PROD"            # TNS alias
  read_only = true                   # only queries: no DML, no DDL

[[connections]]
  name = "admin"
  user = "sys"
  password_env = "ORA_SYS_PASSWORD"
  connect_string = "(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=dbhost)(PORT=1521))(CONNECT_DATA=(SERVICE_NAME=ORCLPDB1)))"
  sysdba = true                      # connect AS SYSDBA

# A password can also be stored in the file (plain text - keep the file private):
#   password = "secret"
